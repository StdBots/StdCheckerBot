version: '3.8'

services:
  bot:
    build: .
    restart: always
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - OWNER_ID=${OWNER_ID:-7394590844}
      - MONGO_URI=mongodb://mongo:27017
      - DB_NAME=stdcheckerbot
      - FORCE_SUB_CHANNEL=${FORCE_SUB_CHANNEL:-StdBots}
      - LOG_CHANNEL_ID=${LOG_CHANNEL_ID:-0}
      - MAX_CONCURRENT_CHECKS=50
      - ENV=production
    depends_on:
      - mongo

  mongo:
    image: mongo:6.0
    restart: always
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
